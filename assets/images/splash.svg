<svg width="100%" viewBox="0 0 402 884" xmlns="http://www.w3.org/2000/svg" style="background:#07071A; display:block; max-width:402px; margin:0 auto;">
<defs>
  <linearGradient id="xpbar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#EC4899"/>
    <stop offset="50%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>
  <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="14" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="402" height="884" fill="#07071A"/>

<!-- Ambient glow behind logo -->
<ellipse cx="201" cy="400" rx="160" ry="140" fill="#3B1F6A" opacity="0.2"/>

<!-- === V + ROTATING NEON CIRCLE === -->
<g transform="translate(201, 400)">
  <!-- Pulse glow -->
  <ellipse cx="0" cy="0" rx="100" ry="100" fill="#7C3AED" opacity="0">
    <animate attributeName="opacity" values="0;0.1;0" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="rx" values="90;120;90" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="90;120;90" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Static base ring (faint) -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="#2A1550" stroke-width="1.5"/>

  <!-- Rotating neon arc 1 (glow) -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="6"
    stroke-linecap="round" stroke-dasharray="260 430" filter="url(#glowStrong)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Rotating neon arc 1 (sharp) -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="3.5"
    stroke-linecap="round" stroke-dasharray="260 430" opacity="0.95">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating neon arc 2 (glow, counter offset) -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="#F0ABFC" stroke-width="3"
    stroke-linecap="round" stroke-dasharray="90 600" filter="url(#glowStrong)" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Rotating neon arc 2 (sharp) -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="#F0ABFC" stroke-width="2"
    stroke-linecap="round" stroke-dasharray="90 600" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- V glow -->
  <text x="0" y="38" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="120" font-weight="900"
    fill="#A855F7" opacity="0.45" filter="url(#glowStrong)">V</text>
  <!-- V sharp -->
  <text x="0" y="38" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="120" font-weight="900"
    fill="url(#vGrad)" opacity="0.97">V</text>
</g>

<!-- === XP BAR (below logo) === -->
<!-- Track -->
<rect x="80" y="550" width="242" height="6" rx="3" fill="#1A1A2E"/>
<!-- XP fill animated -->
<rect x="80" y="550" width="0" height="6" rx="3" fill="url(#xpbar)">
  <animate attributeName="width" from="0" to="174" dur="2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
</rect>
<!-- Level label -->
<text x="80" y="544" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#A855F7" opacity="0.85">LVL 12</text>
<text x="322" y="544" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5A4A7A">2 600 / 3 600 XP</text>

<!-- === LOADING DOTS (bottom) === -->
<g transform="translate(201, 820)">
  <circle cx="-24" cy="0" r="5" fill="#A855F7" opacity="0.3">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="5" fill="#A855F7" opacity="0.3">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="0" r="5" fill="#A855F7" opacity="0.3">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
